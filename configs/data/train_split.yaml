# Training split - 80% of selected files

name: "dadagp_train"

# Data paths
data_dir: "DadaGP-v1.1"
token_pattern: "**/*.tokens.txt"
selected_files_json: "data_splits/train_files.json"  # 4,148 files

# Dataset parameters
max_sequence_length: 512
max_pitch: 127
max_time_shift: 500
num_strings: 6
num_frets: 21

# Train/val/test split (will be ignored since we're using pre-split files)
train_ratio: 0.8
val_ratio: 0.1
test_ratio: 0.1

# DataLoader settings
batch_size: 128
num_workers: 4
pin_memory: true

# Limit number of files (applied after filtering)
max_files: null  # null = use all files in train split
