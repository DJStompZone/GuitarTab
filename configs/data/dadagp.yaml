# DadaGP dataset configuration

name: "dadagp"

# Data paths
data_dir: "DadaGP-v1.1"
token_pattern: "**/*.tokens.txt"
# selected_files_json: null  # null = use all files, or path to JSON file with .gp file names
selected_files_json: "data_splits/train_files.json"  # 4148 files; val/test auto-detected as siblings

# Dataset parameters
max_sequence_length: 512
max_pitch: 127
max_time_shift: 500
num_strings: 6
num_frets: 25

# Output format for input/output sequences
# v1: input = NOTE_ON, NOTE_OFF, TIME_SHIFT; output = NOTE_ON, TAB, NOTE_OFF, TIME_SHIFT
# v2: input = NOTE_ON, NOTE_OFF, TIME_SHIFT; output = TAB, TIME_SHIFT
# v3: input = NOTE_ON, TIME_SHIFT; output = NOTE_ON, TAB, TIME_SHIFT (no NOTE_OFF)
output_format: "v1"

# Train/val/test split
train_ratio: 0.8
val_ratio: 0.1
test_ratio: 0.1

# DataLoader settings
batch_size: 32
num_workers: 4
pin_memory: true

# Limit number of files (for debugging)
max_files: null  # null = use all files
