defaults:
  - config
  - postprocessing: default
  - _self_

# Experiment settings
seed: 42
exp: ${now:%Y-%m-%d_%H-%M}
experiment_name: ${exp}-inference
output_dir: "outputs/${experiment_name}"
# checkpoint_path: outputs/2025-12-05_23-36/checkpoint_epoch_200.pt

# Constrained decoding - enforce valid token grammar at generation time
# When enabled, this replaces post-processing by enforcing constraints during generation
training:
  use_constrained_decoding: false  # Set to true to enable constrained decoding
