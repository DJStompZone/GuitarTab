# Main configuration file for Fretting-Transformer training

defaults:
  - model: t5_small
  - data: dadagp
  - training: default
  - _self_

# Experiment settings
seed: 42
exp: ${now:%Y-%m-%d_%H-%M}
experiment_name: ${exp}
output_dir: "outputs/${experiment_name}"

hydra:
  run:
    # 把 Hydra 的 run 資料夾直接對齊我們自己的 output_dir
    dir: ${output_dir}
  sweep:
    dir: "outputs/multirun"
    subdir: "${hydra.job.num}"

# Weights & Biases (optional)
wandb:
  enabled: false
  project: "guitar-tablature"
  entity: null
