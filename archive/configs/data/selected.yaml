# Selected files configuration - uses files from selected_files.json

name: "dadagp_selected"

# Data paths
data_dir: "DadaGP-v1.1"
token_pattern: "**/*.tokens.txt"
selected_files_json: "selected_files.json"  # Filter using selected files

# Dataset parameters
max_sequence_length: 512
max_pitch: 127
max_time_shift: 500
num_strings: 6
num_frets: 25

# Train/val/test split
train_ratio: 0.8
val_ratio: 0.1
test_ratio: 0.1

# DataLoader settings
batch_size: 32
num_workers: 4
pin_memory: true

# Limit number of files (applied after filtering)
max_files: null  # null = use all selected files
